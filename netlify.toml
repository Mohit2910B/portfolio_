[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "UPLOAD_DIR,NEXT_PUBLIC_SITE_URL,DB_HOST,DB_PORT,DB_USER,DB_NAME,SEED_ADMIN_NAME,SEED_ADMIN_USERNAME,SEED_ADMIN_EMAIL,EMAIL_FROM,RESEND_FROM_EMAIL,SEED_ADMIN_PASSWORD"

[[plugins]]
  package = "@netlify/plugin-nextjs"